<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium CMF Texture Simulator v6</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --text-muted: #888;
            --accent: #4dabf7;
            --accent-hover: #3b8cd9;
            --border: #333;
        }
        body { margin: 0; padding: 0; background-color: var(--bg-color); color: var(--text-main); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; height: 100vh; overflow: hidden; }
        #sidebar { width: 400px; background-color: var(--panel-bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 20px; box-sizing: border-box; overflow-y: auto; z-index: 10; }
        #viewer-container { flex: 1; position: relative; background: #8c8c8c; }
        canvas { display: block; width: 100%; height: 100%; }
        h1 { font-size: 1.2rem; margin-top: 0; margin-bottom: 20px; color: #fff; text-align: center; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
        .control-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 0.9rem; font-weight: 600; color: #bbb; }
        select, input[type="file"], button { width: 100%; padding: 10px; background-color: #2a2a2a; color: #fff; border: 1px solid var(--border); border-radius: 4px; box-sizing: border-box; font-size: 0.9rem; margin-bottom: 10px; }
        select:focus, button:focus { outline: none; border-color: var(--accent); }
        button { background-color: var(--accent); color: #fff; font-weight: bold; cursor: pointer; transition: background 0.2s; border: none; }
        button:hover { background-color: var(--accent-hover); }
        button.secondary { background-color: #444; }
        button.secondary:hover { background-color: #555; }
        .toggle-group { display: flex; gap: 10px; margin-bottom: 10px; }
        .toggle-group label { display: flex; align-items: center; font-weight: normal; font-size: 0.85rem; cursor: pointer; margin: 0;}
        .toggle-group input { margin-right: 5px; width: auto; }
        .slider-container { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        input[type="range"] { flex: 1; cursor: pointer; }
        .slider-val { width: 70px; text-align: right; font-size: 0.85rem; font-family: monospace; color: var(--accent); }
        #insight-panel { background-color: #111; border: 1px solid var(--border); border-radius: 6px; padding: 15px; margin-top: 20px; font-size: 0.85rem; line-height: 1.5; }
        #insight-panel h3 { margin: 0 0 10px 0; font-size: 1rem; color: var(--accent); }
        .insight-stat { display: flex; justify-content: space-between; border-bottom: 1px dashed #333; padding: 4px 0; }
        .insight-stat span:last-child { font-weight: bold; color: #fff; }
        .insight-desc { margin-top: 10px; color: #aaa; font-style: italic; }
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        .btn-group button { flex: 1; margin: 0; }
        #loading { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); color: #fff; display: none; align-items: center; justify-content: center; font-size: 1.2rem; font-weight: bold; z-index: 20; }
        #img-preview { width: 100%; height: 120px; background-color: #111; border: 1px solid #333; border-radius: 4px; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
        #img-preview img { max-width: 100%; max-height: 100%; object-fit: contain; }
        #img-preview span { color: #555; font-size: 0.8rem; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/STLExporter.js"></script>
</head>
<body>
    <div id="sidebar">
        <h1>CMF Texture Simulator</h1>
        <div class="control-group">
            <label>1. 패턴 이미지 업로드 (Displacement)</label>
            <div id="img-preview"><span id="preview-text">이미지 없음 (기본 패턴 사용)</span><img id="preview-img" style="display:none;"/></div>
            <input type="file" id="file-upload" accept="image/png, image/jpeg" />
            <div class="toggle-group">
                <label><input type="checkbox" id="toggle-invert"> Invert (음각/양각 반전)</label>
            </div>
        </div>
        <div class="control-group">
            <label>2. 적용 부위 (Part)</label>
            <select id="sel-part">
                <option value="exterior">외관 메인부 (Deep but Flat)</option>
                <option value="functional">기능부/그립 (Shallow but Sharp)</option>
            </select>
        </div>
        <div class="control-group">
            <label>3. 소재 (Material)</label>
            <select id="sel-material">
                <option value="sand">기본 샌드 (Basic Sand)</option>
                <option value="wood">우드 (Wood)</option>
                <option value="stone">스톤 (Stone)</option>
                <option value="fabric">패브릭 (Fabric)</option>
                <option value="metal">메탈 및 기하학 (Metal & Geo)</option>
            </select>
        </div>
        <div class="control-group">
            <label>4. 감성 등급 (Grade)</label>
            <select id="sel-grade">
                <option value="fine">고운 (Fine)</option>
                <option value="medium" selected>중간 (Medium)</option>
                <option value="coarse">거친 (Coarse)</option>
            </select>
        </div>
        <div class="control-group">
            <label>실시간 깊이 (Depth: µm)</label>
            <div class="slider-container">
                <input type="range" id="slider-depth" min="0" max="1000" step="1" value="100">
                <div class="slider-val"><span id="val-depth">100</span> µm</div>
            </div>
        </div>
        <div class="control-group">
            <label>패턴 반복 밀도 (Scale 배율)</label>
            <div class="slider-container">
                <input type="range" id="slider-repeat" min="0.5" max="30" step="0.5" value="1.0">
                <div class="slider-val"><span id="val-repeat">1.0</span> x</div>
            </div>
        </div>
        <div id="insight-panel">
            <h3>AI Haptic Insight</h3>
            <div class="insight-stat"><span>추천 깊이:</span> <span id="stat-depth">-</span></div>
            <div class="insight-stat"><span>가이드 간격 (RSm):</span> <span id="stat-rsm">-</span></div>
            <div class="insight-stat"><span>왜곡도 가이드:</span> <span id="stat-rsk">-</span></div>
            <div class="insight-stat"><span>빼기 구배:</span> <span id="stat-draft">-</span></div>
            <div class="insight-desc" id="stat-desc">DB 매칭을 대기 중입니다.</div>
        </div>
        <div class="btn-group">
            <button class="secondary" id="btn-reset">초기화</button>
            <button id="btn-export-png">PNG 저장</button>
            <button id="btn-export-stl" style="background:#28a745;">STL 저장</button>
        </div>
    </div>
    <div id="viewer-container">
        <div id="loading">렌더링 중...</div>
    </div>

<script>
const CMF_DB = {
    exterior: {
        sand: {
            fine: { depth_um: 15, rsm_mm: 0.1, rsk_guideline: "Rsk=0", draft_deg: 1.5, label: "실크 무광", insight: "부드러운 빛 반사와 고급스러운 실크 느낌을 줍니다." },
            medium: { depth_um: 35, rsm_mm: 0.3, rsk_guideline: "Rsk < -1.5", draft_deg: 2.0, label: "프리미엄 매트", insight: "빛의 산란을 유도해 스크래치를 효과적으로 감춥니다." },
            coarse: { depth_um: 60, rsm_mm: 0.5, rsk_guideline: "Rsk < -1.0", draft_deg: 4.0, label: "주물 느낌, 라운드 마감", insight: "무게감 있는 외관을 연출하며, 라운드 마감 처리되어 피부 접촉 시 불쾌감이 없습니다." }
        },
        wood: {
            fine: { depth_um: 40, rsm_mm: 1.0, rsk_guideline: "Rsk ≪ 0", draft_deg: 3.0, label: "부드러운 베니어", insight: "잔잔한 우드결 방향성이 살아있으며 시각적 안정감을 줍니다." },
            medium: { depth_um: 120, rsm_mm: 1.5, rsk_guideline: "Rsk < 0", draft_deg: 7.5, label: "자동차 인테리어 표준", insight: "고급차 내장재에 주로 쓰이는 깊이감입니다." },
            coarse: { depth_um: 250, rsm_mm: 2.0, rku_guideline: "Rku < 2.5", rsk_guideline: "-", draft_deg: 12.0, label: "고목재, 긁힘 방지 라운딩", insight: "거친 원목의 야생적인 느낌을 주되, 둥글게 깎아 스크래치에 강합니다." }
        },
        stone: {
            fine: { depth_um: 10, rsm_mm: "무작위 패턴", rsk_guideline: "Rsk ≪ 0", draft_deg: 1.5, label: "매끄러운 폴리싱 대리석", insight: "차갑고 매끄러운 감촉을 시각화합니다." },
            medium: { depth_um: 80, rsm_mm: 1.5, rsk_guideline: "Rsk < 0", draft_deg: 4.5, label: "자연 풍화석", insight: "자연스럽게 마모된 스톤 표면." },
            coarse: { depth_um: 250, rsm_mm: 3.0, rsk_guideline: "Rsk < -1.0", draft_deg: 12.0, label: "클레프트 슬레이트", insight: "깊은 크랙과 음각이 강조된 강인한 바디." }
        },
        fabric: {
            fine: { depth_um: 30, rsm_mm: 0.15, rsk_guideline: "Rsk < 0", draft_deg: 2.0, label: "극세사 실크", insight: "손가락이 스칠 때 미세한 진동 피드백 유도." },
            medium: { depth_um: 127, rsm_mm: 0.4, rsk_guideline: "Rsk < 0", draft_deg: 5.0, label: "가전 린넨 직조 표준", insight: "현대 홈가전에 널리 쓰이는 따뜻한 패브릭 룩." },
            coarse: { depth_um: 180, rsm_mm: 0.8, rku_guideline: "Rku < 2.5", rsk_guideline: "-", draft_deg: 10.0, label: "굵은 캔버스", insight: "틈새가 너무 깊지 않게 조절된 아웃도어 캔버스." }
        },
        metal: {
            fine: { depth_um: 10, rsm_mm: 0.01, rsk_guideline: "Rsk = 0", draft_deg: 1.0, label: "미러 폴리싱", insight: "극대화된 평탄도로 금속의 찬란한 광택." },
            medium: { depth_um: 20, rsm_mm: 0.05, rsk_guideline: "Rsk < -1.0", draft_deg: 2.0, label: "예리한 헤어라인", insight: "빛의 맺힘을 길게 연장시켜 차가운 느낌 강조." },
            coarse: { depth_um: 150, rsm_mm: 2.0, rsk_guideline: "Rsk < 0", draft_deg: 7.5, label: "3D 폴리곤", insight: "메카닉한 다각형 구조, 모서리 라운딩 마감." }
        }
    },
    functional: {
        sand: {
            fine: { depth_um: 30, rsm_mm: 0.2, rsk_guideline: "Rsk > 1.0", draft_deg: 2.0, label: "마이크로 엣지 그립", insight: "얕지만 뾰족한 엣지들이 피부 미세 주름에 물려 강력한 논슬립." },
            medium: { depth_um: 80, rsm_mm: 0.8, rsk_guideline: "Rsk > 0.5", draft_deg: 5.0, label: "스티플 그립", insight: "카메라 바디 등에 쓰이는 신뢰도 높은 마찰 표면." },
            coarse: { depth_um: 150, rsm_mm: 1.2, rsk_guideline: "Rsk > 1.0", draft_deg: 7.5, label: "극한 그립", insight: "오염물이나 땀이 묻어도 마찰력을 유지하는 하드코어 그립." }
        },
        wood: {
            fine: { depth_um: 80, rsm_mm: 0.5, rsk_guideline: "Rsk > 0.5", draft_deg: 5.0, label: "방향성 그립", insight: "슬라이드 조작부에 최적화된 결 방향성 마찰력." },
            medium: { depth_um: 180, rsm_mm: 1.5, rsk_guideline: "Rsk > 0.5", draft_deg: 9.0, label: "입체 우드 그립", insight: "관절이 안착할 수 있는 굴곡." },
            coarse: { depth_um: 280, rsm_mm: 2.5, rsk_guideline: "Rsk > 1.0", draft_deg: 13.0, label: "3D 락 핑거그립", insight: "손가락을 고정시키는 락킹 구조." }
        },
        stone: {
            fine: { depth_um: 60, rsm_mm: 0.2, rsk_guideline: "Rsk > 1.0", draft_deg: 4.5, label: "마이크로 사암", insight: "고운 사포 같은 촉감으로 슬립 원천 차단." },
            medium: { depth_um: 150, rsm_mm: "무작위 패턴", rsk_guideline: "Rsk > 0.5", draft_deg: 9.0, label: "현무암 펀칭 그립", insight: "기공들이 흡착력을 높여 젖은 손에도 훌륭함." },
            coarse: { depth_um: 280, rsm_mm: "무작위 패턴", rsk_guideline: "Rsk > 1.5", draft_deg: 13.0, label: "화강암 그립", insight: "초거친 돌기 마감으로 아웃도어용 최적화." }
        },
        fabric: {
            fine: { depth_um: 60, rsm_mm: 0.6, rsk_guideline: "Rsk > 0.5", draft_deg: 4.5, label: "스포츠 메쉬", insight: "통기성과 안정적인 마찰력 유지." },
            medium: { depth_um: 120, rsm_mm: 1.0, rsk_guideline: "Rsk > 0.5", draft_deg: 7.5, label: "데님 십자 격자", insight: "상하좌우 균일한 저항력을 제공." },
            coarse: { depth_um: 250, rsm_mm: 1.5, rsk_guideline: "Rsk > 1.0", draft_deg: 12.0, label: "위빙 스트랩 단차", insight: "기기와 손이 물리적으로 맞물리는 굵은 교차 단차." }
        },
        metal: {
            fine: { depth_um: 80, rsm_mm: 0.5, rsk_guideline: "Rsk > 1.0", draft_deg: 5.0, label: "마이크로 엣지", insight: "정교한 회전 조작을 위한 미세 가공." },
            medium: { depth_um: 120, rsm_mm: 1.0, rsk_guideline: "Rsk > 1.0", draft_deg: 7.5, label: "기어 패턴", insight: "확실한 체결감과 피드백을 전달하는 기하학적 요철." },
            coarse: { depth_um: 250, rsm_mm: 1.5, rku_guideline: "Rku > 3.5", rsk_guideline: "-", draft_deg: 12.0, label: "다이아몬드 널링", insight: "절대 미끄러지지 않는 널링." }
        }
    }
};

let scene, camera, renderer, controls;
let planeMesh, planeMaterial, topGeometry;
let baseMesh;
let currentTexture = null;
let currentImageData = null;

// 실사 크기 기준 (1 unit = 1mm)
const PLANE_SIZE = 200; // 200mm x 200mm 캔버스
const THICKNESS = 5;    // 5mm 두께 판

const selPart = document.getElementById('sel-part');
const selMaterial = document.getElementById('sel-material');
const selGrade = document.getElementById('sel-grade');
const fileUpload = document.getElementById('file-upload');
const toggleInvert = document.getElementById('toggle-invert');
const sliderDepth = document.getElementById('slider-depth');
const sliderRepeat = document.getElementById('slider-repeat');
const valDepth = document.getElementById('val-depth');
const valRepeat = document.getElementById('val-repeat');
const loading = document.getElementById('loading');

function init() {
    initThree();
    bindEvents();
    generateDefaultTexture();
    updateFromDB();
}

function initThree() {
    const container = document.getElementById('viewer-container');
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0xd0d0d0);

    camera = new THREE.PerspectiveCamera(40, container.clientWidth / container.clientHeight, 1, 2000);
    camera.position.set(0, 250, 300);

    try {
        renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);
    } catch(e) {
        container.innerHTML = "<div style='padding:20px; color:red;'>WebGL 오류</div>";
        return;
    }

    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2 - 0.05;

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
    dirLight.position.set(100, 100, 100);
    dirLight.castShadow = true;
    dirLight.shadow.camera.left = -150;
    dirLight.shadow.camera.right = 150;
    dirLight.shadow.camera.top = 150;
    dirLight.shadow.camera.bottom = -150;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    scene.add(dirLight);
    
    const fillLight = new THREE.DirectionalLight(0xaaccff, 0.3);
    fillLight.position.set(-100, 50, -100);
    scene.add(fillLight);

    // 1. 하단 베이스 (5mm 두께 판)
    const baseGeo = new THREE.BoxGeometry(PLANE_SIZE, THICKNESS, PLANE_SIZE);
    const baseMat = new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.8 });
    baseMesh = new THREE.Mesh(baseGeo, baseMat);
    baseMesh.position.y = -THICKNESS / 2;
    baseMesh.receiveShadow = true;
    baseMesh.castShadow = true;
    scene.add(baseMesh);

    // 2. 텍스처 윗면
    topGeometry = new THREE.PlaneGeometry(PLANE_SIZE, PLANE_SIZE, 1024, 1024);
    topGeometry.rotateX(-Math.PI / 2);
    
    planeMaterial = new THREE.MeshStandardMaterial({
        color: 0x888888, 
        roughness: 0.6,
        metalness: 0.2,
        displacementScale: 0.1, 
        map: null 
    });
    
    planeMesh = new THREE.Mesh(topGeometry, planeMaterial);
    planeMesh.position.y = 0.01; 
    planeMesh.receiveShadow = true;
    planeMesh.castShadow = true;
    scene.add(planeMesh);

    window.addEventListener('resize', onWindowResize, false);
    animate();
}

function onWindowResize() {
    const container = document.getElementById('viewer-container');
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
}

function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
}

function bindEvents() {
    selPart.addEventListener('change', updateFromDB);
    selMaterial.addEventListener('change', updateFromDB);
    selGrade.addEventListener('change', updateFromDB);
    
    sliderDepth.addEventListener('input', (e) => {
        valDepth.innerText = e.target.value;
        updateDisplacementScale();
    });
    
    sliderRepeat.addEventListener('input', (e) => {
        valRepeat.innerText = parseFloat(e.target.value).toFixed(1);
        updateTextureRepeat();
    });

    fileUpload.addEventListener('change', handleImageUpload);
    toggleInvert.addEventListener('change', applyTexture);
    
    document.getElementById('btn-reset').addEventListener('click', () => {
        fileUpload.value = "";
        generateDefaultTexture();
        selPart.value = "exterior";
        selMaterial.value = "sand";
        selGrade.value = "medium";
        toggleInvert.checked = false;
        updateFromDB();
    });

    document.getElementById('btn-export-png').addEventListener('click', exportPNG);
    document.getElementById('btn-export-stl').addEventListener('click', exportSTL);
}

function updateFromDB() {
    const dbData = CMF_DB[selPart.value][selMaterial.value][selGrade.value];
    if(!dbData) return;

    document.getElementById('stat-depth').innerText = dbData.depth_um + ' µm';
    document.getElementById('stat-rsm').innerText = typeof dbData.rsm_mm === 'number' ? dbData.rsm_mm + ' mm' : dbData.rsm_mm;
    
    let rsk_str = dbData.rsk_guideline || "";
    let rku_str = dbData.rku_guideline || "";
    document.getElementById('stat-rsk').innerText = [rsk_str, rku_str].filter(x=>x && x!=="-").join(" / ");
    document.getElementById('stat-draft').innerText = dbData.draft_deg + '°';
    
    document.getElementById('stat-desc').innerHTML = `<strong style="color:var(--accent)">[${dbData.label}]</strong><br>${dbData.insight}`;

    sliderDepth.value = dbData.depth_um;
    valDepth.innerText = dbData.depth_um;
    updateDisplacementScale();
    
    updateMaterialLook(selMaterial.value, selGrade.value);
}

function updateMaterialLook(mat, grade) {
    let col = 0x888888, mtl = 0.2, rgh = 0.7;
    if(mat === 'metal') { col = 0xa0a0a0; mtl = 0.9; rgh = grade === 'fine' ? 0.1 : 0.4; }
    else if(mat === 'wood') { col = 0x7e5e40; mtl = 0.05; rgh = 0.85; }
    else if(mat === 'stone') { col = 0x666666; mtl = 0.1; rgh = 0.9; }
    else if(mat === 'fabric') { col = 0x5a6a7a; mtl = 0.0; rgh = 1.0; }
    
    planeMaterial.color.setHex(col);
    planeMaterial.metalness = mtl;
    planeMaterial.roughness = rgh;
    baseMesh.material.color.setHex(col); 
}

function updateDisplacementScale() {
    if(!planeMaterial) return;
    const depth_um = parseFloat(sliderDepth.value);
    planeMaterial.displacementScale = depth_um / 1000.0;
}

function updateTextureRepeat() {
    if(!currentTexture) return;
    const scale = parseFloat(sliderRepeat.value);
    currentTexture.repeat.set(scale, scale);
    currentTexture.needsUpdate = true;
}

function handleImageUpload(e) {
    const file = e.target.files[0];
    if(!file) return;
    loading.style.display = 'flex';
    const reader = new FileReader();
    reader.onload = function(event) {
        const img = new Image();
        img.onload = function() { processImage(img); };
        img.src = event.target.result;
        document.getElementById('preview-img').src = event.target.result;
        document.getElementById('preview-img').style.display = 'block';
        document.getElementById('preview-text').style.display = 'none';
    };
    reader.readAsDataURL(file);
}

function generateDefaultTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 512; canvas.height = 512;
    const ctx = canvas.getContext('2d');
    const imgData = ctx.createImageData(512, 512);
    for(let i=0; i<imgData.data.length; i+=4) {
        let val = Math.floor(Math.random() * 255);
        imgData.data[i] = val; imgData.data[i+1] = val; imgData.data[i+2] = val; imgData.data[i+3] = 255;
    }
    ctx.putImageData(imgData, 0, 0);
    ctx.globalAlpha = 0.5;
    for(let i=0; i<5; i++) {
        ctx.drawImage(canvas, 2, 0); ctx.drawImage(canvas, 0, 2);
    }
    const img = new Image();
    img.onload = () => processImage(img);
    img.src = canvas.toDataURL();
    document.getElementById('preview-img').style.display = 'none';
    document.getElementById('preview-text').style.display = 'block';
    document.getElementById('preview-text').innerText = "기본 생성 패턴";
}

function processImage(img) {
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    let w = img.width, h = img.height;
    if(w > 1024 || h > 1024) { let ratio = Math.min(1024/w, 1024/h); w = Math.floor(w*ratio); h = Math.floor(h*ratio); }
    canvas.width = w; canvas.height = h;
    ctx.drawImage(img, 0, 0, w, h);
    currentImageData = { canvas, ctx, w, h };
    applyTexture();
}

function applyTexture() {
    if(!currentImageData) return;
    loading.style.display = 'flex';
    setTimeout(() => {
        const { ctx, w, h } = currentImageData;
        const imgData = ctx.getImageData(0, 0, w, h);
        const data = imgData.data;
        const invert = toggleInvert.checked;
        let min = 255, max = 0;
        for(let i=0; i<data.length; i+=4) {
            let gray = data[i]*0.3 + data[i+1]*0.59 + data[i+2]*0.11;
            if(gray < min) min = gray; if(gray > max) max = gray;
        }
        const range = max - min === 0 ? 1 : max - min;
        for(let i=0; i<data.length; i+=4) {
            let gray = data[i]*0.3 + data[i+1]*0.59 + data[i+2]*0.11;
            let norm = ((gray - min) / range) * 255;
            if(invert) norm = 255 - norm;
            // 엠보감을 살리기 위해 대비를 유지한 흑백톤(Grayscale) 생성
            data[i] = data[i+1] = data[i+2] = norm; data[i+3] = 255;
        }
        const pc = document.createElement('canvas');
        pc.width = w; pc.height = h;
        pc.getContext('2d').putImageData(imgData, 0, 0);
        
        new THREE.TextureLoader().load(pc.toDataURL(), (tex) => {
            tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
            if(currentTexture) currentTexture.dispose();
            currentTexture = tex;
            
            planeMaterial.displacementMap = currentTexture;
            // 핵심 수정: 단일 컬러톤 위에 흑백 음영 맵을 덮어서 엠보감과 그림자(Ambient Occlusion 효과)가 확 살아나도록 복구
            planeMaterial.map = currentTexture; 
            planeMaterial.needsUpdate = true;
            
            updateTextureRepeat();
            updateDisplacementScale();
            loading.style.display = 'none';
        });
    }, 50);
}

function exportPNG() {
    const link = document.createElement('a');
    link.href = renderer.domElement.toDataURL('image/png');
    link.download = 'CMF_Texture_v6.png';
    link.click();
}

function exportSTL() {
    alert("STL 기능은 복합 Mesh(블록+표면) 처리 관계로 이번 버전에서는 평면 메쉬만 추출합니다.");
    const exporter = new THREE.STLExporter();
    const result = exporter.parse(planeMesh);
    const blob = new Blob([result], { type: 'text/plain' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'CMF_Texture_Top.stl';
    link.click();
}
